<!DOCTYPE html>
<html>
<head>
    <title>AptiCourse</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .chat-box {
            max-width: 700px;
            margin: 40px auto;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
        }
        .chat-header {
            padding: 15px 20px;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border-color);
        }
        .chat-header h1 {
            color: var(--accent-yellow);
            font-size: 18px;
            margin: 0;
        }
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
        }
        .msg {
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 10px;
            max-width: 80%;
        }
        .user-msg {
            background: var(--accent-yellow);
            color: var(--text-dark);
            margin-left: auto;
        }
        .ai-msg {
            background: var(--bg-dark);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .input-area {
            padding: 15px;
            background: var(--bg-dark);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 14px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-yellow);
        }
        button {
            padding: 12px 25px;
            background: var(--accent-yellow);
            color: var(--text-dark);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: var(--accent-yellow-hover);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .key-section {
            padding: 15px 20px;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border-color);
        }
        .key-section input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 12px;
        }
        .info {
            padding: 10px 15px;
            background: var(--bg-dark);
            color: var(--text-secondary);
            font-size: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .info a {
            color: var(--accent-yellow);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="main.html" class="navbar-brand">AptiCourser</a>
        <span><a href="main.html" class="link">Back</a></span>
    </nav>
    
    <div class="chat-box">
        <div class="key-section">
            <input type="text" id="apiKey" placeholder="Enter Groq API key (gsk_...)" onchange="saveKey()">
        </div>
        <div class="info">
            Get free key: <a href="https://console.groq.com" target="_blank">console.groq.com</a>
        </div>
        <div class="chat-header">
            <h1>AI Assistant</h1>
        </div>
        <div class="chat-messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="if(event.key==='Enter')send()">
            <button onclick="send()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const messages = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const apiKeyInput = document.getElementById('apiKey');
        const sendBtn = document.getElementById('sendBtn');
        
        let apiKey = localStorage.getItem('groq_key') || '';
        apiKeyInput.value = apiKey;
        let chatHistory = [];
        
        function saveKey() {
            apiKey = apiKeyInput.value.trim();
            localStorage.setItem('groq_key', apiKey);
        }
        
        function addMsg(text, isUser) {
            const div = document.createElement('div');
            div.className = 'msg ' + (isUser ? 'user-msg' : 'ai-msg');
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
        
        async function send() {
            const text = userInput.value.trim();
            if (!text) return;
            
            if (!apiKey) {
                alert('Enter your Groq API key first');
                apiKeyInput.focus();
                return;
            }
            
            addMsg(text, true);
            userInput.value = '';
            sendBtn.disabled = true;
            
            chatHistory.push({ role: 'user', content: text });
            
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: chatHistory.slice(-6),
                        max_tokens: 512
                    })
                });
                
                if (!response.ok) {
                    throw new Error('API error - check your key');
                }
                
                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMsg(reply, false);
                chatHistory.push({ role: 'assistant', content: reply });
                
            } catch (e) {
                addMsg('Error: ' + e.message, false);
            }
            
            sendBtn.disabled = false;
        }
    </script>
</body>
</html>
