<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course - Aptitude Project</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="main.html" class="navbar-brand">AptiCourser</a>
        <div class="navbar-user">
            <span><a href="main.html" class="link">Back to Menu</a></span>
        </div>
    </nav>

    <div class="container">
        <h1>Complete Course</h1>
        
        <div class="form-group">
            <label>Select Topic:</label>
            <select id="topicSelect" onchange="topicChanged()">
                <option value="">-- Select a topic --</option>
            </select>
        </div>
        
        <div id="topicInfo" class="form-group" style="display: none;">
            <p>Status: <span id="topicStatus"></span></p>
            <p>Attempts: <span id="topicAttempts">0</span></p>
            <p>Best Score: <span id="topicBestScore">-</span></p>
            <button class="btn btn-primary btn-block" id="startTopicBtn" onclick="startTopicTest()">Start Topic</button>
        </div>
        
        <div class="course-info" style="text-align: center; margin: 30px 0;">
            <p>Topics Completed: <span id="completedCount">0</span> / <span id="totalCount">11</span></p>
        </div>
        
        <div id="congratsMessage" style="display: none; text-align: center; padding: 30px; background-color: var(--bg-dark); border-radius: 12px;">
            <h2>Congratulations!</h2>
            <p>You have completed all topics!</p>
            <button class="btn btn-primary" onclick="resetCourse()">Restart Course</button>
        </div>
    </div>

    <script>
        var userId = localStorage.getItem('userId');
        
        var topics = [
            'Problem on trains',
            'Time and Work',
            'Profit and Loss',
            'Problems on Ages',
            'Average',
            'Permutation and Combination',
            'Time and Distance',
            'Simple Interest',
            'Percentage',
            'Ratio and Proportion',
            'Probability'
        ];
        
        // Map display names to API topic names
        var topicNameMap = {
            'Problem on trains': 'Problem on trains',
            'Time and Work': 'time and work',
            'Profit and Loss': 'profit and loss',
            'Problems on Ages': 'problems on ages',
            'Average': 'average',
            'Permutation and Combination': 'permutation and combination',
            'Time and Distance': 'time and distance',
            'Simple Interest': 'simple interest',
            'Percentage': 'percentage',
            'Ratio and Proportion': 'ratio and proportion',
            'Probability': 'probability'
        };
        
        if (!userId) {
            window.location.href = 'login.html';
        }
        
        var progressData = {};
        
        function getProgress() {
            return progressData;
        }
        
        function init() {
            var select = document.getElementById('topicSelect');
            topics.forEach(function(topic) {
                var option = document.createElement('option');
                option.value = topic;
                option.textContent = topic;
                select.appendChild(option);
            });
            
            loadProgressFromDB();
        }
        
        function loadProgressFromDB() {
            fetch('/api/progress/user/' + userId)
                .then(response => response.json())
                .then(data => {
                    // Convert array to object
                    if (Array.isArray(data)) {
                        data.forEach(function(item) {
                            progressData[item.topic] = {
                                completed: item.completed,
                                attempts: item.attempts,
                                bestScore: item.score,
                                totalQuestions: 0
                            };
                        });
                    }
                    updateOverallProgress();
                })
                .catch(error => {
                    console.log('Failed to load progress from database, starting fresh');
                    initializeProgress();
                });
        }
        
        function initializeProgress() {
            var initialProgress = {};
            topics.forEach(function(topic) {
                var apiName = topicNameMap[topic];
                initialProgress[apiName] = { completed: false, attempts: 0, bestScore: 0, totalQuestions: 0 };
            });
            progressData = initialProgress;
            updateOverallProgress();
        }
        
        function updateOverallProgress() {
            var completed = 0;
            topics.forEach(function(topic) {
                var apiName = topicNameMap[topic];
                if (progressData[apiName] && progressData[apiName].completed) {
                    completed++;
                }
            });
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = topics.length;
            
            if (completed === topics.length) {
                document.getElementById('congratsMessage').style.display = 'block';
                document.querySelector('.container > .form-group').style.display = 'none';
            }
        }
        
        function topicChanged() {
            var select = document.getElementById('topicSelect');
            var topic = select.value;
            var infoDiv = document.getElementById('topicInfo');
            
            if (!topic) {
                infoDiv.style.display = 'none';
                return;
            }
            
            var apiName = topicNameMap[topic];
            var topicData = progressData[apiName] || { completed: false, attempts: 0, bestScore: 0, totalQuestions: 0 };
            
            var statusText = topicData.completed ? 'Completed' : (topicData.attempts > 0 ? 'In Progress' : 'Not Started');
            document.getElementById('topicStatus').textContent = statusText;
            document.getElementById('topicAttempts').textContent = topicData.attempts;
            document.getElementById('topicBestScore').textContent = topicData.totalQuestions > 0 ? topicData.bestScore + '%' : '-';
            
            infoDiv.style.display = 'block';
        }
        
        function startTopicTest() {
            var select = document.getElementById('topicSelect');
            var topic = select.value;
            
            if (!topic) {
                alert('Please select a topic');
                return;
            }
            
            var apiName = topicNameMap[topic];
            
            fetch('/api/questions/topic/' + encodeURIComponent(apiName) + '/random?count=5')
                .then(response => response.json())
                .then(questions => {
                    if (questions.length === 0) {
                        alert('No questions available for this topic.');
                        return;
                    }
                    localStorage.setItem('currentTopic', topic);
                    localStorage.setItem('testQuestions', JSON.stringify(questions));
                    localStorage.setItem('testMode', 'topic');
                    window.location.href = 'test.html';
                })
                .catch(error => {
                    alert('Failed to load questions.');
                });
        }
        
        function resetCourse() {
            if (confirm('Are you sure you want to reset your course progress?')) {
                var resetPromises = [];
                
                topics.forEach(function(topic) {
                    var apiName = topicNameMap[topic];
                    progressData[apiName] = { completed: false, attempts: 0, bestScore: 0, totalQuestions: 0 };
                    
                    resetPromises.push(
                        fetch('/api/progress/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                userId: parseInt(userId),
                                topic: apiName,
                                attempts: 0,
                                score: 0,
                                completed: false
                            })
                        })
                    );
                });
                
                Promise.all(resetPromises).then(function() {
                    window.location.reload();
                });
            }
        }
        
        init();
    </script>
</body>
</html>
