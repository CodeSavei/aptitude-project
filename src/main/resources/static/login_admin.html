<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Aptitude Project</title>
<link rel="stylesheet" href="global.css">
<style>
.admin-wrapper {
display: flex;
min-height: calc(100vh - 60px);
}

.sidebar {
width: 260px;
background: var(--bg-card);
padding: 20px 0;
flex-shrink: 0;
border-right: 2px solid var(--accent-yellow);
}

.sidebar-header {
padding: 0 20px 20px;
border-bottom: 1px solid var(--border-color);
margin-bottom: 20px;
}

.sidebar-header h3 {
color: var(--accent-yellow);
margin: 0;
font-size: 16px;
}

.sidebar-header p {
color: var(--text-secondary);
margin: 5px 0 0;
font-size: 11px;
}

.sidebar-menu {
list-style: none;
padding: 0;
margin: 0;
}

.sidebar-menu li {
margin-bottom: 4px;
}

.sidebar-menu a {
display: block;
padding: 12px 20px;
color: var(--text-secondary);
text-decoration: none;
transition: all 0.2s ease;
border-left: 3px solid transparent;
}

.sidebar-menu a:hover,
.sidebar-menu a.active {
background: var(--bg-card-hover);
color: var(--accent-yellow);
border-left-color: var(--accent-yellow);
}

.sidebar-menu a.active {
color: var(--accent-yellow);
}

.main-content {
flex: 1;
padding: 30px;
background: var(--bg-dark);
}

.admin-section {
background: var(--bg-card);
border-radius: 8px;
border: 1px solid var(--border-color);
margin-bottom: 25px;
}

.section-header {
background: transparent;
border-bottom: 2px solid var(--accent-yellow);
padding: 15px 20px;
}

.section-header h3 {
color: var(--accent-yellow);
margin: 0;
font-size: 15px;
font-weight: 500;
}

.section-body {
padding: 20px;
}

.form-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 18px;
}

.form-grid .full-width {
grid-column: span 2;
}

.form-group {
margin-bottom: 12px;
}

.form-group label {
display: block;
margin-bottom: 6px;
color: var(--text-secondary);
font-size: 13px;
}

.form-group input,
.form-group select {
width: 100%;
padding: 10px 12px;
background: var(--bg-dark);
border: 1px solid var(--border-color);
color: var(--text-primary);
font-size: 14px;
transition: border-color 0.2s ease;
}

.form-group input:focus,
.form-group select:focus {
outline: none;
border-color: var(--accent-yellow);
}

.options-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 12px;
}

.options-grid input {
padding: 10px;
}

.btn-group {
display: flex;
gap: 12px;
margin-top: 18px;
}

.btn {
padding: 10px 18px;
border: none;
border-radius: 4px;
cursor: pointer;
font-size: 13px;
font-weight: 500;
transition: all 0.2s ease;
}

.btn-primary {
background: var(--accent-yellow);
color: var(--text-dark);
}

.btn-primary:hover {
background: var(--accent-yellow-hover);
}

.btn-success {
background: var(--success);
color: white;
}

.btn-success:hover {
background: var(--success-hover);
}

.btn-danger {
background: var(--error);
color: white;
}

.btn-danger:hover {
background: #c82333;
}

.message {
padding: 12px 16px;
border-radius: 4px;
margin-bottom: 20px;
font-size: 13px;
}

.message.success {
background: rgba(40, 167, 69, 0.2);
color: #5cb85c;
border: 1px solid #5cb85c;
}

.message.error {
background: rgba(220, 53, 69, 0.2);
color: #ff6b6b;
border: 1px solid #ff6b6b;
}

.hidden {
display: none;
}

table {
width: 100%;
border-collapse: collapse;
margin-top: 15px;
}

table th,
table td {
padding: 12px;
text-align: left;
border-bottom: 1px solid var(--border-color);
}

table th {
color: var(--accent-yellow);
font-weight: 500;
font-size: 12px;
text-transform: uppercase;
letter-spacing: 0.5px;
}

table tr:hover {
background: var(--bg-card-hover);
}

.table-container {
overflow-x: auto;
}

.admin-info {
display: flex;
align-items: center;
color: var(--text-primary);
padding: 15px 20px;
background: var(--bg-dark);
margin-bottom: 15px;
border-bottom: 1px solid var(--border-color);
}

.admin-avatar {
width: 36px;
height: 36px;
background: var(--accent-yellow);
color: var(--text-dark);
border-radius: 4px;
display: flex;
align-items: center;
justify-content: center;
margin-right: 12px;
font-weight: 600;
font-size: 14px;
}

.admin-details span {
display: block;
}

.admin-details .name {
font-weight: 500;
font-size: 14px;
}

.admin-details .role {
font-size: 11px;
color: var(--text-secondary);
}

@media (max-width: 768px) {
.admin-wrapper {
flex-direction: column;
}

.sidebar {
width: 100%;
}

.form-grid {
grid-template-columns: 1fr;
}

.form-grid .full-width {
grid-column: span 1;
}

.options-grid {
grid-template-columns: repeat(2, 1fr);
}
}
</style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
<a href="#" class="navbar-brand">AptiCourser</a>
<button class="btn btn-danger btn-sm" onclick="logout()" style="margin-left: auto;">Logout</button>
</nav>

<div class="admin-wrapper">
<!-- Sidebar -->
<aside class="sidebar">
<div class="admin-info">
<div class="admin-avatar" id="adminAvatar">A</div>
<div class="admin-details">
<span class="name" id="adminName">Admin</span>
<span class="role">Administrator</span>
</div>
</div>
<ul class="sidebar-menu">
<li><a href="#" class="active" data-section="addQuestion">Add Question</a></li>
<li><a href="#" data-section="addAdmin">Add Admin</a></li>
<li><a href="#" data-section="deleteQuestion">Delete Question</a></li>
<li><a href="#" data-section="viewQuestions">View Questions</a></li>
</ul>
</aside>

<!-- Main Content -->
<main class="main-content">
<div id="adminMessage" class="message hidden"></div>

<!-- Add Question Section -->
<div class="admin-section" id="section-addQuestion">
<div class="section-header">
<h3>Add New Question</h3>
</div>
<div class="section-body">
<form id="addQuestionForm">
<div class="form-grid">
<div class="form-group full-width">
<label>Category/Topic</label>
<select id="questionTopic" required>
<option value="">Select a category</option>
<option value="Problem on trains">Problem on trains</option>
<option value="time and work">Time and work</option>
<option value="profit and loss">Profit and loss</option>
<option value="problems on ages">Problems on ages</option>
<option value="average">Average</option>
<option value="permutation and combination">Permutation and combination</option>
<option value="time and distance">Time and distance</option>
<option value="simple interest">Simple interest</option>
<option value="percentage">Percentage</option>
<option value="ratio and proportion">Ratio and proportion</option>
<option value="probability">Probability</option>
</select>
</div>
<div class="form-group full-width">
<label>Question</label>
<input type="text" id="questionText" placeholder="Enter the question" required>
</div>
<div class="form-group full-width">
<label>Options</label>
<div class="options-grid">
<input type="text" id="optionA" placeholder="Option A" required>
<input type="text" id="optionB" placeholder="Option B" required>
<input type="text" id="optionC" placeholder="Option C" required>
<input type="text" id="optionD" placeholder="Option D" required>
</div>
</div>
<div class="form-group">
<label>Correct Answer</label>
<select id="correctOption" required>
<option value="">Select</option>
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
</select>
</div>
</div>
<div class="btn-group">
<button type="submit" class="btn btn-primary">Add Question</button>
</div>
</form>
</div>
</div>

<!-- Add Admin Section -->
<div class="admin-section hidden" id="section-addAdmin">
<div class="section-header">
<h3>Add New Admin</h3>
</div>
<div class="section-body">
<form id="addAdminForm">
<div class="form-grid">
<div class="form-group">
<label>Username</label>
<input type="text" id="adminUsername" placeholder="Enter username" required>
</div>
<div class="form-group">
<label>Email</label>
<input type="email" id="adminEmail" placeholder="Enter email" required>
</div>
<div class="form-group full-width">
<label>Password</label>
<input type="password" id="adminPassword" placeholder="Enter password" required>
</div>
</div>
<div class="btn-group">
<button type="submit" class="btn btn-success">Add Admin</button>
</div>
</form>
</div>
</div>

<!-- Delete Question Section -->
<div class="admin-section hidden" id="section-deleteQuestion">
<div class="section-header">
<h3>Delete Question</h3>
</div>
<div class="section-body">
<form id="deleteQuestionForm">
<div class="form-grid">
<div class="form-group">
<label>Question ID to Delete</label>
<input type="number" id="deleteQuestionId" placeholder="Enter question ID" required>
</div>
</div>
<div class="btn-group">
<button type="submit" class="btn btn-danger">Delete Question</button>
</div>
</form>
</div>
</div>

<!-- View Questions Section -->
<div class="admin-section hidden" id="section-viewQuestions">
<div class="section-header">
<h3>View Questions</h3>
</div>
<div class="section-body">
<form id="viewQuestionsForm">
<div class="form-grid">
<div class="form-group">
<label>Select Category</label>
<select id="viewTopic">
<option value="all">All Categories</option>
<option value="Problem on trains">Problem on trains</option>
<option value="time and work">Time and work</option>
<option value="profit and loss">Profit and loss</option>
<option value="problems on ages">Problems on ages</option>
<option value="average">Average</option>
<option value="permutation and combination">Permutation and combination</option>
<option value="time and distance">Time and distance</option>
<option value="simple interest">Simple interest</option>
<option value="percentage">Percentage</option>
<option value="ratio and proportion">Ratio and proportion</option>
<option value="probability">Probability</option>
</select>
</div>
</div>
<div class="btn-group">
<button type="submit" class="btn btn-primary">View Questions</button>
</div>
</form>
<div id="questionsTable" class="table-container"></div>
</div>
</div>
</main>
</div>

<script>
function showMessage(message, isError) {
const element = document.getElementById('adminMessage');
element.textContent = message;
element.className = 'message ' + (isError ? 'error' : 'success');
element.classList.remove('hidden');
setTimeout(() => {
element.classList.add('hidden');
}, 5000);
}

function logout() {
localStorage.removeItem('userId');
localStorage.removeItem('username');
localStorage.removeItem('role');
window.location.href = 'login.html';
}

// Check if user is admin
const userRole = localStorage.getItem('role');
if (userRole !== 'admin') {
window.location.href = 'login.html';
}

// Set admin name in sidebar
const adminName = localStorage.getItem('username');
if (adminName) {
document.getElementById('adminName').textContent = adminName;
document.getElementById('adminAvatar').textContent = adminName.charAt(0).toUpperCase();
}

// Sidebar navigation
document.querySelectorAll('.sidebar-menu a').forEach(link => {
link.addEventListener('click', function(e) {
e.preventDefault();
const section = this.getAttribute('data-section');

document.querySelectorAll('.sidebar-menu a').forEach(l => l.classList.remove('active'));
this.classList.add('active');

document.querySelectorAll('.admin-section').forEach(s => s.classList.add('hidden'));
document.getElementById('section-' + section).classList.remove('hidden');
});
});

// Add Question Form
document.getElementById('addQuestionForm').addEventListener('submit', async (e) => {
e.preventDefault();

const questionData = {
question: document.getElementById('questionText').value,
optionA: document.getElementById('optionA').value,
optionB: document.getElementById('optionB').value,
optionC: document.getElementById('optionC').value,
optionD: document.getElementById('optionD').value,
correctOption: document.getElementById('correctOption').value,
topic: document.getElementById('questionTopic').value
};

try {
const response = await fetch('/api/questions', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(questionData)
});

const data = await response.json();

if (data.id) {
showMessage('Question added successfully with ID: ' + data.id, false);
document.getElementById('addQuestionForm').reset();
} else {
showMessage('Failed to add question', true);
}
} catch (error) {
showMessage('Error adding question: ' + error.message, true);
}
});

// Add Admin Form
document.getElementById('addAdminForm').addEventListener('submit', async (e) => {
e.preventDefault();

const adminData = {
username: document.getElementById('adminUsername').value,
email: document.getElementById('adminEmail').value,
password: document.getElementById('adminPassword').value,
role: 'admin'
};

try {
const response = await fetch('/api/auth/register-admin', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(adminData)
});

const data = await response.json();

if (data.success) {
showMessage('Admin user created successfully with ID: ' + data.userId, false);
document.getElementById('addAdminForm').reset();
} else {
showMessage(data.message || 'Failed to create admin user', true);
}
} catch (error) {
showMessage('Error creating admin user: ' + error.message, true);
}
});

// Delete Question Form
document.getElementById('deleteQuestionForm').addEventListener('submit', async (e) => {
e.preventDefault();

const questionId = document.getElementById('deleteQuestionId').value;

if (!confirm('Are you sure you want to delete question with ID ' + questionId + '?')) {
return;
}

try {
const response = await fetch('/api/questions/' + questionId, {
method: 'DELETE'
});

if (response.ok) {
showMessage('Question deleted successfully', false);
document.getElementById('deleteQuestionForm').reset();
} else {
const errorData = await response.json();
showMessage('Failed to delete question: ' + (errorData.message || 'Unknown error'), true);
}
} catch (error) {
showMessage('Error deleting question: ' + error.message, true);
}
});

// View Questions Form
document.getElementById('viewQuestionsForm').addEventListener('submit', async (e) => {
e.preventDefault();

const topic = document.getElementById('viewTopic').value;
let url = '/api/questions';
if (topic !== 'all') {
url = '/api/questions/topic/' + encodeURIComponent(topic);
}

try {
const response = await fetch(url);
const questions = await response.json();

if (questions.length === 0) {
document.getElementById('questionsTable').innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 20px;">No questions found.</p>';
return;
}

let html = '<table><thead><tr><th>ID</th><th>Question</th><th>Topic</th><th>Answer</th></tr></thead><tbody>';
questions.forEach(q => {
html += '<tr><td>' + q.id + '</td><td>' + q.question + '</td><td>' + q.topic + '</td><td>' + q.correctOption + '</td></tr>';
});
html += '</tbody></table>';
document.getElementById('questionsTable').innerHTML = html;
} catch (error) {
showMessage('Error fetching questions: ' + error.message, true);
}
});
</script>
</body>
</html>
