<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Aptitude Project</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
<a href="#" class="navbar-brand">AptiCourser</a>
</nav>

<div class="container">
<img src="/images/logo.png" alt="Logo" style="display: block; margin: 0 auto 20px; max-width: 600px;">

<!-- Login Form -->
<div id="loginSection">
<h2>Login</h2>
<div id="loginMessage" class="message hidden"></div>

<form id="loginForm">
<div class="form-group">
<label>Username</label>
<input type="text" id="username" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<button type="submit" class="btn btn-primary btn-block">Login</button>
</form>

<p class="text-center">
No account? <a href="#" class="link" onclick="showRegister()">Register</a>
</p>
</div>

<!-- Register Form -->
<div id="registerSection" class="hidden">
<h2>Register</h2>
<div id="registerMessage" class="message hidden"></div>

<form id="registerForm">
<div class="form-group">
<label>Username</label>
<input type="text" id="regUsername" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="regEmail" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="regPassword" required>
</div>

<button type="submit" class="btn btn-primary btn-block">Register</button>
</form>

<p class="text-center">
Have account? <a href="#" class="link" onclick="showLogin()">Login</a>
</p>
</div>
</div>

<script>
function showRegister() {
document.getElementById('loginSection').classList.add('hidden');
document.getElementById('registerSection').classList.remove('hidden');
}

function showLogin() {
document.getElementById('registerSection').classList.add('hidden');
document.getElementById('loginSection').classList.remove('hidden');
}

function showMessage(elementId, message, isError) {
const element = document.getElementById(elementId);
element.textContent = message;
element.className = 'message ' + (isError ? 'error' : 'success');
element.classList.remove('hidden');
}

function hideMessage(elementId) {
document.getElementById(elementId).classList.add('hidden');
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
e.preventDefault();
hideMessage('loginMessage');

const username = document.getElementById('username').value;
const password = document.getElementById('password').value;

try {
const response = await fetch('/api/auth/login', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ username, password })
});

const data = await response.json();

if (data.success) {
localStorage.setItem('userId', data.userId);
localStorage.setItem('username', data.username);
localStorage.setItem('role', data.role);

if (data.role === 'admin') {
window.location.href = 'login_admin.html';
} else {
window.location.href = 'main.html';
}
} else {
showMessage('loginMessage', data.message, true);
}
} catch (error) {
showMessage('loginMessage', 'Login failed. Please try again.', true);
}
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
e.preventDefault();
hideMessage('registerMessage');

const username = document.getElementById('regUsername').value;
const email = document.getElementById('regEmail').value;
const password = document.getElementById('regPassword').value;

try {
const response = await fetch('/api/auth/register', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ username, email, password })
});

const data = await response.json();

if (data.success) {
showMessage('registerMessage', 'Registration successful! Please login.', false);
document.getElementById('registerForm').reset();
setTimeout(() => showLogin(), 1500);
} else {
showMessage('registerMessage', data.message, true);
}
} catch (error) {
showMessage('registerMessage', 'Registration failed. Please try again.', true);
}
});
</script>
</body>
</html>
