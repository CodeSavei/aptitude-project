<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Test - Aptitude Project</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="main.html" class="navbar-brand">AptiCourser</a>
        <div class="navbar-user">
            <span><a href="main.html" class="link">Back to Menu</a></span>
        </div>
    </nav>

    <div class="container">
        <h1>Create Your Own Test</h1>
        
        <div class="form-group">
            <label>Select Topics:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="topicProblemOnTrains" value="Problem on trains">
                <label for="topicProblemOnTrains">Problem on trains</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="topicTimeAndWork" value="time and work">
                <label for="topicTimeAndWork">Time and work</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="topicProfitAndLoss" value="profit and loss">
                <label for="topicProfitAndLoss">Profit and loss</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="topicProblemsOnAges" value="problems on ages">
                <label for="topicProblemsOnAges">Problems on ages</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="topicAverage" value="average">
                <label for="topicAverage">Average</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="topicPermutationAndCombination" value="permutation and combination">
                <label for="topicPermutationAndCombination">Permutation and combination</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="topicTimeAndDistance" value="time and distance">
                <label for="topicTimeAndDistance">Time and distance</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="topicSimpleInterest" value="simple interest">
                <label for="topicSimpleInterest">Simple interest</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="topicPercentage" value="percentage">
                <label for="topicPercentage">Percentage</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="topicRatioAndProportion" value="ratio and proportion">
                <label for="topicRatioAndProportion">Ratio and proportion</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="topicProbability" value="probability">
                <label for="topicProbability">Probability</label>
            </div>
        </div>
        
        <div class="form-group">
            <label>Number of Questions:</label>
            <select id="questionCount">
                <option value="3">3 Questions</option>
                <option value="5" selected>5 Questions</option>
                <option value="10">10 Questions</option>
            </select>
        </div>
        
        <button class="btn btn-primary btn-block" onclick="startTest()">Start Test</button>
    </div>

    <script>
        async function startTest() {
            const problemOnTrainsSelected = document.getElementById('topicProblemOnTrains').checked;
            const timeAndWorkSelected = document.getElementById('topicTimeAndWork').checked;
            const profitAndLossSelected = document.getElementById('topicProfitAndLoss').checked;
            const problemsOnAgesSelected = document.getElementById('topicProblemsOnAges').checked;
            const averageSelected = document.getElementById('topicAverage').checked;
            const permutationAndCombinationSelected = document.getElementById('topicPermutationAndCombination').checked;
            const timeAndDistanceSelected = document.getElementById('topicTimeAndDistance').checked;
            const simpleInterestSelected = document.getElementById('topicSimpleInterest').checked;
            const percentageSelected = document.getElementById('topicPercentage').checked;
            const ratioAndProportionSelected = document.getElementById('topicRatioAndProportion').checked;
            const probabilitySelected = document.getElementById('topicProbability').checked;
            const count = document.getElementById('questionCount').value;
            
            let allQuestions = [];
            
            if (problemOnTrainsSelected) {
                const response = await fetch('/api/questions/topic/Problem on trains/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            if (timeAndWorkSelected) {
                const response = await fetch('/api/questions/topic/time and work/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            if (profitAndLossSelected) {
                const response = await fetch('/api/questions/topic/profit and loss/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            if (problemsOnAgesSelected) {
                const response = await fetch('/api/questions/topic/problems on ages/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            if (averageSelected) {
                const response = await fetch('/api/questions/topic/average/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            if (permutationAndCombinationSelected) {
                const response = await fetch('/api/questions/topic/permutation and combination/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            if (timeAndDistanceSelected) {
                const response = await fetch('/api/questions/topic/time and distance/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            if (simpleInterestSelected) {
                const response = await fetch('/api/questions/topic/simple interest/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            if (percentageSelected) {
                const response = await fetch('/api/questions/topic/percentage/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            if (ratioAndProportionSelected) {
                const response = await fetch('/api/questions/topic/ratio and proportion/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            if (probabilitySelected) {
                const response = await fetch('/api/questions/topic/probability/random?count=' + count);
                const data = await response.json();
                allQuestions = allQuestions.concat(data);
            }
            
            
            if (allQuestions.length === 0) {
                const response = await fetch('/api/questions/random?count=' + count);
                allQuestions = await response.json();
            }
            
            questions = allQuestions.slice(0, count);
            
            if (questions.length === 0) {
                alert('No questions available. Please add questions to the database.');
                return;
            }
            
            localStorage.setItem('testQuestions', JSON.stringify(questions));
            localStorage.setItem('testMode', 'custom');
            window.location.href = 'test.html';
        }
    </script>
</body>
</html>
